name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      should_release:
        description: Build and publish a release
        required: true
        type: boolean
        default: false
      build_smoke_test:
        description: Build Windows artifacts without creating a release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: Validate (${{ matrix.check.name }})
    runs-on: ${{ matrix.check.runner }}
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Lint
            command: npm run lint
            runner: ubuntu-latest
          - name: Storybook
            command: npm run build-storybook
            runner: ubuntu-latest
          - name: Tests
            command: npm test
            runner: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Cache node_modules and native builds
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            node_modules
            .vite
            **/node_modules
            **/*.node
            **/build/Release
          # Every simulator's native sources, not only iRacing's: binding.gyp
          # also builds src/app/lmu/native, and a key blind to it restored
          # build/Release from main and tested a stale lmu_replay.exe.
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-v2-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/binding.gyp', 'src/app/*/native/**/*.c', 'src/app/*/native/**/*.cc', 'src/app/*/native/**/*.cpp', 'src/app/*/native/**/*.h', 'src/app/*/native/**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-v2-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-v2-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

      - name: Upload coverage report
        if: matrix.check.name == 'Tests'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

  build:
    name: build
    needs: validation
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Confirm validation passed
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [[ "$VALIDATION_RESULT" != "success" ]]; then
            echo "Validation result: $VALIDATION_RESULT" >&2
            exit 1
          fi

  release-gate:
    name: Determine release eligibility
    if: github.event_name == 'push' || inputs.should_release || inputs.build_smoke_test
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # Fetch the last 2 commits to compare versions
          persist-credentials: false

      - name: Check release conditions
        id: gate
        shell: bash
        env:
          DISPATCH_SHOULD_RELEASE: ${{ inputs.should_release }}
          DISPATCH_BUILD_SMOKE_TEST: ${{ inputs.build_smoke_test }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_SHOULD_RELEASE" == "true" || "$DISPATCH_BUILD_SMOKE_TEST" == "true" ]]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          currentVersion=$(node -p "require('./package.json').version")
          previousVersion=$(git show HEAD^:package.json | node -e \
            "let input = ''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));")

          if [[ -z "$currentVersion" || -z "$previousVersion" ]]; then
            echo "Could not determine current and previous package versions." >&2
            exit 1
          fi

          if [[ "$currentVersion" != "$previousVersion" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version changed from $previousVersion to $currentVersion"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish Windows artifacts
    needs: [build, release-gate]
    if: needs.release-gate.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build native iRacing addon
        run: npm run irsdk:build

      # --- Release -----------------------------------------------------------
      # Pushes release only when the version in package.json changes. Manual
      # runs release only when should_release is enabled. build_smoke_test
      # runs the same build but uploads CI artifacts instead of creating a
      # GitHub release. Pull requests never enter this flow.
      # Flow: package once -> make Squirrel artifacts and save make results ->
      # release using the saved make results.
      # The build is not code signed, so Windows SmartScreen warns on the first
      # install. POSTHOG_KEY is deliberately not set: without it the packaged
      # app never starts analytics.

      - name: Package Windows application
        run: npx electron-forge package

      - name: Verify packaged native iRacing addon
        shell: pwsh
        run: |
          $asarPath = 'out/tearoff-win32-x64/resources/app.asar'
          $builtAddon = 'build/Release/irsdk_node.node'
          $packagedAddon = `
            'out/tearoff-win32-x64/resources/app.asar.unpacked/.vite/build/Release/irsdk_node.node'

          if (-not (Test-Path -LiteralPath $asarPath -PathType Leaf)) {
            throw "Packaged ASAR not found: $asarPath"
          }
          if (-not (Test-Path -LiteralPath $builtAddon -PathType Leaf)) {
            throw "Built native addon not found: $builtAddon"
          }
          if (-not (Test-Path -LiteralPath $packagedAddon -PathType Leaf)) {
            throw "Unpacked native addon not found: $packagedAddon"
          }

          $builtHash = (Get-FileHash -LiteralPath $builtAddon -Algorithm SHA256).Hash
          $packagedHash = `
            (Get-FileHash -LiteralPath $packagedAddon -Algorithm SHA256).Hash
          if ($builtHash -ne $packagedHash) {
            throw "Packaged native addon does not match the freshly built addon. Built: $builtHash; packaged: $packagedHash"
          }

      - name: Build Squirrel artifacts
        run: npx electron-forge make --from-package

      - name: Upload Windows test artifacts
        if: inputs.build_smoke_test
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-artifacts
          if-no-files-found: error
          path: out/make/squirrel.windows/x64/*

      - name: Publish release
        if: inputs.build_smoke_test != true
        run: npx electron-forge release --from-make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
